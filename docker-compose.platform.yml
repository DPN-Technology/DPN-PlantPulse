services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: plantpulse
      POSTGRES_USER: plantpulse
      POSTGRES_PASSWORD: plantpulse
    ports:
      - "5432:5432"
    volumes:
      - plantpulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantpulse -d plantpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: plantpulse
      MINIO_ROOT_PASSWORD: plantpulse-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - plantpulse-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 plantpulse plantpulse-local-secret; do sleep 2; done;
      mc mb --ignore-existing local/plantpulse;
      exit 0;
      "

  platform:
    build:
      context: ./server
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8787
      DATABASE_URL: postgresql://plantpulse:plantpulse@postgres:5432/plantpulse
      PLATFORM_AUTH_MODE: development
      S3_REGION: us-east-1
      S3_BUCKET: plantpulse
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: plantpulse
      AWS_SECRET_ACCESS_KEY: plantpulse-local-secret
    command: ["/bin/sh", "-c", "node dist/migrate.js && node dist/index.js"]
    ports:
      - "8787:8787"

volumes:
  plantpulse-postgres:
  plantpulse-minio:
