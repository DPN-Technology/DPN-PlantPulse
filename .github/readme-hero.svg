    <text x="0" y="300" fill="#71877a" font-family="ui-monospace, monospace" font-size="12" letter-spacing="2">DEVELOP. PIONEER. NAVIGATE.</text>
  </g>

  <g transform="translate(790 90)">
    <circle cx="155" cy="125" r="122" fill="#06110b" stroke="#1c6c3d" stroke-width="2"/>
    <circle cx="155" cy="125" r="96" fill="none" stroke="#163b26" stroke-width="1" stroke-dasharray="6 7"/>
    <circle cx="155" cy="125" r="72" fill="none" stroke="#2b7a48" stroke-width="1" opacity=".7"/>

    <path d="M148 190 C104 169 86 132 104 95 C123 56 169 42 210 50 C211 95 203 135 179 162 C167 176 157 185 148 190Z"
          fill="#0d2a18" stroke="#3dff8d" stroke-width="3" filter="url(#glow)"/>
    <path d="M149 187 C151 151 158 116 184 74" fill="none" stroke="#7bffad" stroke-width="3"/>
    <path d="M154 151 C137 136 123 123 111 106M158 132 C175 118 190 104 202 89M151 169 C167 157 181 145 191 132"
          fill="none" stroke="#2ecf6d" stroke-width="2"/>

    <path d="M32 125 H82 L95 104 L111 154 L131 83 L151 145 L169 116 H278"
