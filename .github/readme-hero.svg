    <path d="M259 4 L228 66 L251 61 L226 118 L282 42 L257 48 Z"
          fill="#ff1d35" opacity=".9" filter="url(#glow)"/>

    <text x="155" y="276" text-anchor="middle" fill="#39ff88" font-family="ui-monospace, monospace" font-size="14" font-weight="800" letter-spacing="2">PLANTPULSE SCORE // LIVE MODEL</text>
    <text x="155" y="300" text-anchor="middle" fill="#8cae98" font-family="ui-monospace, monospace" font-size="11">VISION • CARE • SENSORS • CLOUD</text>
  </g>

  <g transform="translate(870 383)" font-family="ui-monospace, monospace" font-size="10">
    <text fill="#42f78b">v0.11.0</text>
    <text x="58" fill="#566b5e">|</text>
    <text x="76" fill="#b9c9be">OFFLINE-FIRST</text>
    <text x="174" fill="#566b5e">|</text>
    <text x="192" fill="#ff4958">DPN CORE</text>
  </g>
</svg>