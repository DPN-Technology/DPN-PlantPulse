  <text x="48" y="66" fill="#718a79" font-family="ui-monospace, monospace" font-size="11">01010011 01000011 01000001 01001110 → 01000001 01001110 01000001 01001100 01011001 01011010 01000101 → 01000001 01000011 01010100</text>

  <path d="M126 143 H1075" stroke="#133d25" stroke-width="7" stroke-linecap="round"/>
  <path d="M126 143 H612" stroke="#39ff88" stroke-width="2" filter="url(#g)"/>
  <path d="M612 143 H1075" stroke="#ff2638" stroke-width="2" opacity=".8"/>

