    <text x="22" y="103" fill="#8ea797" font-family="Arial, sans-serif" font-size="12">confidence • evidence • findings</text>
    <circle cx="217" cy="119" r="13" fill="#092012" stroke="#39ff88"/>
    <circle cx="217" cy="119" r="4" fill="#39ff88"/>
  </g>

  <g transform="translate(330 91)">
