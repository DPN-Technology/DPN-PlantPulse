  <text x="48" y="267" fill="#597064" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1.4">DPN TECHNOLOGY // DEVELOP WHAT DOESN'T EXIST • PIONEER WHAT COMES NEXT • NAVIGATE THE FUTURE</text>
