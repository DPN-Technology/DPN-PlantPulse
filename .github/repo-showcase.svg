<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">DPN PlantPulse capability mesh</title>
  <desc id="desc">Four PlantPulse capability modules connected by an emerald and red telemetry bus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050706"/>
      <stop offset=".5" stop-color="#07130c"/>
      <stop offset="1" stop-color="#070405"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="285" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="283" rx="19" fill="none" stroke="#18462c"/>
