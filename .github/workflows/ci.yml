name: PlantPulse CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: plantpulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate DPN Operational Control contract
        run: npm run validate:dpn-control

      - name: Mobile TypeScript
        run: npm run typecheck
      - name: Platform TypeScript
        run: npm run server:typecheck
      - name: Platform build
        run: npm run server:build
      - name: Mobile platform connectivity tests
        run: npm run test:mobile-platform
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Critical dependency audit
        run: npm audit --audit-level=critical

  platform-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: plantpulse
          POSTGRES_USER: plantpulse
          POSTGRES_PASSWORD: plantpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantpulse -d plantpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://plantpulse:plantpulse@127.0.0.1:5432/plantpulse
      TEST_DATABASE_URL: postgresql://plantpulse:plantpulse@127.0.0.1:5432/plantpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply platform schema
        run: npm run server:migrate
      - name: Run platform integration tests
        run: npm run server:test
